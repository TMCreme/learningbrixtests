[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html

markers =
    smoke: minimal critical-path subset (run pre-commit)
    slow: long-running tests (excluded from smoke)
    super_admin: requires SuperAdmin role
    school_admin: requires SchoolAdmin role
    teacher: requires Teacher role
    student: requires Student role
    guardian: requires Guardian role
    accountant: requires Accountant role
    negative: negative-path / access-denied assertions
    demo(feature_id, title, subtitle): records a narrated feature video via the `demo` fixture
    provisioning: exercises the school provisioning playbook
    provisioning_smoke_only: collapse the parametrised `provisioned_school` fixture onto the first scenario
    scenario(*ids): run only against the named feature_scenarios.yaml scenarios (deselects the other `provisioned_school` params)
