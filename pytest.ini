[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html

markers =
    smoke: minimal critical-path subset (run pre-commit)
    slow: long-running tests (excluded from smoke)
    super_admin: requires SuperAdmin role
    school_admin: requires SchoolAdmin role
    teacher: requires Teacher role
    student: requires Student role
    guardian: requires Guardian role
    accountant: requires Accountant role
    negative: negative-path / access-denied assertions
