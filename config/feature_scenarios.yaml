# Each scenario provisions one test school with a specific feature-pack mix.
# Every module test runs once per scenario:
#   • module in scenario.modules     → positive path expected
#   • module not in scenario.modules → negative path (access denied) expected
#
# Coverage invariant, enforced by config/scenarios.py::coverage_warnings():
# every module in config/module_catalog.py is ON in at least one scenario and
# OFF in at least one other. The single exception is `school_configuration`,
# which the loader REQUIRES in every scenario — without it a SchoolAdmin cannot
# complete onboarding, so it is deliberately never negatively tested.
#
# school_name / feature_pack_name are suffixed with a per-run tag at
# provisioning time (see tests/fixtures/data_factories.py::run_tag) so parallel
# agents never collide on names. The "TEST" prefix is what the orphan sweeper
# matches on — do not remove it.

scenarios:
  # ── 1. Everything on. The positive-path baseline for every module. ─────────
  - id: full_access
    school_name: "TEST Mountain View Academy"
    feature_pack_name: "TEST All Modules"
    modules:
      - home
      - dashboard
      - students
      - staff
      - guardians
      - fees
      - incomes_and_expenses
      - employee_benefit
      - staff_payroll
      - categories
      - catalogue
      - statistics
      - requests_and_renewals
      - subjects
      - classes_and_timetables
      - exams
      - attendance
      - lessons
      - syllabi
      - topics
      - assessments
      - student_timetables
      - student_scores
      - change_requests
      - incidents
      - school_admin_dashboard
      - school_configuration
      - access_roles
      - audit_trails
      - academic_year_and_term
      - messaging
      - community

  # ── 2. Teaching-focused school. No money, no library, no comms. ────────────
  #    Also drops school_admin_dashboard, so that module gets a negative path.
  - id: academics_only
    school_name: "TEST Sunrise Prep"
    feature_pack_name: "TEST Academics Pack"
    modules:
      - home
      - dashboard
      - school_configuration
      - academic_year_and_term
      - access_roles
      - students
      - staff
      - guardians
      - subjects
      - classes_and_timetables
      - exams
      - attendance
      - lessons
      - syllabi
      - topics
      - assessments
      - student_timetables
      - student_scores

  # ── 3. Bursary / back-office school. Finance + payroll, no teaching. ───────
  - id: finance_only
    school_name: "TEST Riverside Finance School"
    feature_pack_name: "TEST Finance Pack"
    modules:
      - home
      - dashboard
      - school_admin_dashboard
      - school_configuration
      - academic_year_and_term
      - access_roles
      - audit_trails
      - students
      - staff
      - fees
      - incomes_and_expenses
      - employee_benefit
      - staff_payroll

  # ── 4. Library + engagement school. Comms, incidents, change requests. ─────
  - id: library_and_community
    school_name: "TEST Bookworm Academy"
    feature_pack_name: "TEST Library & Community Pack"
    modules:
      - home
      - dashboard
      - school_admin_dashboard
      - school_configuration
      - academic_year_and_term
      - access_roles
      - students
      - staff
      - guardians
      - categories
      - catalogue
      - statistics
      - requests_and_renewals
      - messaging
      - community
      - incidents
      - change_requests

  # ── 5. Floor case. The most restricted pack the product can actually make. ─
  #    NOT an empty pack: the feature-pack builder locks the "people" and
  #    "governance" groups into every pack (BASIC_GROUPS in
  #    smsfrontend/src/app/module/feature_flag/{create,edit}/page.tsx), with only
  #    guardians and families optional inside them. Governance being core and
  #    always on is intended product behaviour, confirmed 2026-08-09.
  #
  #    So these nine modules are listed because the app WILL license them
  #    whatever this file says. Declaring only two made the scenario a fiction
  #    and put eight units in the queue asserting a denial that can never
  #    happen; those are now `always_licensed` units instead, and this scenario
  #    is what they run against.
  - id: minimal
    school_name: "TEST Bare Bones School"
    feature_pack_name: "TEST Minimal Pack"
    modules:
      - home
      - dashboard
      - students
      - staff
      - school_admin_dashboard
      - school_configuration
      - access_roles
      - audit_trails
      - academic_year_and_term
